 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-section{
            background-color: brown;
            height: 500px ;
        }
        .grid-container{
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px ;
            gap: 10px 15px;
            padding: 60px;
            justify-content: center;
            align-content: center;


        }
        .grid-container .items{
            background-color: black;
            color: antiquewhite;
            padding: 15px;

        }
        .items2{
            grid-area:items2;
        }
        .items4{
            grid-area: items5;
        }

    </style>
 </head>
 <body>
      <section class="grid-section">
        <h>CSS with grid Area</h>
        <div class="grid-container" >
            <div class="items items1">items1</div>
            <div class="items items2">items2</div>
            <div class="items items3">items3</div>
            <div class="items items4 ">items4</div>
            <div class="items items5 ">items5</div>

        </div>

      </section>
 </body>
 </html>
