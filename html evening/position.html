 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions 11th lacture</title>
    <style>
      /* For absolute */
      .absolute{
         border: 5px solid blue;
         position: relative;
         /* position: relative appy if page move according to its parents;= with out relative positions box move according to web page  */
      }
      /* Navbar */
      *{
         margin: 0px;
         padding: 0px;
         box-sizing: border-box;
      }
      .topbar{
         background-color: brown;
         color: bisque;
      }

      .navbar{
         background-color: black;
         color: beige;
         padding: 10px 15px;
         /* position: fixed;  It can be used to fixed navbar on the road */
         position: sticky;
         /* sticty position can be used to show topbar on top */
         top: 0px;
         width: 100%;
         z-index: 10;
      }
      .navbar h1{
         display: inline-block;
      }
      .navbar  nav{
         display: inline-block;
         margin-left: 30px;
      }
      nav a{
         text-decoration: none;
         color: blanchedalmond;
         margin: 0px 10px;

      }
      .navbar .btn{
         background-color: blue;
         text-decoration: none;
         color: rgb(81, 30, 110);
         padding: 10px 15px;
         border-radius: 5px;
         float: right;

      }

      .absolute{
         margin-top: 50px;
      }
      
      .absolute div{
         width: 200px ;
         height: 200px;
         background-color: aqua;
         display: inline-block;
      }
      .absolute .box2{
         background-color: black;
         position: absolute;
         right: 0px;
         bottom:  0px;
      }
      /* For relative  */
      .relative{
         border: 6px solid red;
      }
      .relative div{
         height: 300px;
         width: 300px;
         background-color: chocolate;
         display: inline-block;
      }
      .relative .box1{
         position: relative;
         z-index: 3;
      }
      .relative .box2 {
         background-color: black;
         position: relative;
         top: 40px;
         /* left: 30px; */
         right: 150px;
         /* z-index: 1; */
         /* z-index is use to give orders to elnments or boxs in web page  by defult every elnment or box have z index order 1 */
      }
      .relative .box3{
         background-color: blue;
         position: relative;
         top: 80px;
         /* left: 90px; */
         right: 700px;
      }
      /* fixed or fixed div */
      .fixed{
         width: 300px;
         height: 300px;
         background-color: pink;
         position: fixed;
         top: 300px;
         right: 150px;
      }
      .fixed2{
         width:400px;
         height: 400px;
         background-color: black;
         position: fixed;
         top: 300px;
         left: 300px;
      }
    </style>
 </head>
